<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="logo">SB</span><span>StudyBench</span></div>
    <label class="lbl">Topic</label>
    <div class="topicrow"><select id="topicSel"></select><button class="btn sm" id="newTopic" title="New topic">+</button></div>
    <nav id="nav"></nav>
    <div id="jobs"></div>
  </aside>
  <main>
    <header id="top">
      <div id="crumb"></div>
      <div id="timer"></div>
    </header>
    <section id="main"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="practice.js"></script>
<script src="extra.js"></script>
</body>
</html>
